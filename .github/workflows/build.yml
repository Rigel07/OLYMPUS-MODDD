name: Build Mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Descomprimir el zip del mod
        run: |
          mkdir -p modsrc
          ZIPS=$(find . -name "*.zip" -not -path "./modsrc/*" -not -path "./.git/*")
          if [ -z "$ZIPS" ]; then
            echo "No se encontro ningun .zip en el repositorio"
            exit 1
          fi
          echo "$ZIPS" | while read -r Z; do
            echo "Descomprimiendo: $Z"
            unzip -q -o "$Z" -d modsrc
          done
          GRADLE_FILE=$(find modsrc -name build.gradle | head -n 1)
          if [ -z "$GRADLE_FILE" ]; then
            echo "No se encontro build.gradle dentro del zip"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLE_FILE")
          echo "Proyecto en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Compilar el mod
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon --stacktrace

      - name: Subir el .jar
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
          if-no-files-found: error
